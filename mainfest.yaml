apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    
spec:
  replicas: 10
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
      
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
        
    spec:
    topologySpreadConstraints:
    - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        project: roboshop
        # tier: frontend
        # component: frontend
    containers:
    - name: nginx
      image: nginx:latest 
      ports:
      - containerPort: 80
---
